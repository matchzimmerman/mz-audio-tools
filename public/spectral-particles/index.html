<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050505">
<title>MZ Spectral Organic Field / 03</title>
<style>
:root{--bg:#050505;--fg:#f2ff00;--muted:#99a16e;--line:#31351a}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--fg);font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
body{display:grid;grid-template-rows:auto 1fr;min-height:100svh}
header{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:8px max(8px,env(safe-area-inset-right)) 8px max(8px,env(safe-area-inset-left));border-bottom:1px solid var(--line);background:#090909;z-index:2}
.brand{font-weight:900;letter-spacing:.08em;margin-right:auto;white-space:nowrap}
button,label.file,.sel{appearance:none;border:1px solid var(--fg);background:#0b0b0b;color:var(--fg);padding:8px 10px;font:inherit;font-weight:800;cursor:pointer;border-radius:0;touch-action:manipulation}
button:hover,label.file:hover,.sel:focus-within,button.active{background:var(--fg);color:#050505}
input[type=file]{display:none}
.sel{display:flex;align-items:center;gap:8px}
.sel span{font-size:11px;letter-spacing:.08em}
select{appearance:none;border:0;background:transparent;color:inherit;font:inherit;font-weight:900;outline:none;cursor:pointer;min-width:150px}
.control{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:11px}
input[type=range]{width:88px;accent-color:var(--fg)}
#stage{position:relative;min-height:0;overflow:hidden}
canvas{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges}
#hud{position:absolute;left:max(10px,env(safe-area-inset-left));bottom:max(10px,env(safe-area-inset-bottom));display:grid;grid-template-columns:auto 110px;gap:3px 8px;font-size:10px;pointer-events:none;text-shadow:0 1px #000}
.meter{height:7px;border:1px solid var(--line);background:#090909}.fill{height:100%;background:var(--fg)}
#status{position:absolute;right:max(10px,env(safe-area-inset-right));bottom:max(10px,env(safe-area-inset-bottom));color:var(--muted);font-size:10px;max-width:42vw;text-align:right;pointer-events:none}
@media(max-width:920px){.control{display:none}}
@media(max-width:760px){header{padding:6px max(6px,env(safe-area-inset-right)) 6px max(6px,env(safe-area-inset-left))}.brand{width:100%;margin-bottom:2px}button,label.file,.sel{padding:7px 8px;font-size:12px}.sel span{font-size:10px}#status{max-width:54vw}#hud{font-size:9px}}
</style>
</head>
<body>
<header>
  <div class="brand">MZ SPECTRAL ORGANIC FIELD / 03</div>
  <label class="file">LOAD AUDIO<input id="file" type="file" accept="audio/*"></label>
  <button id="mic">MIC</button>
  <button id="demo" class="active">DEMO SIGNAL</button>
  <button id="reset">RESEED</button>
  <button id="fullscreen">FULLSCREEN</button>
  <label class="sel"><span>PRESET</span>
    <select id="preset">
      <option value="liquid">LIQUID CELLS</option>
      <option value="ribbon">RIBBON FLOW</option>
      <option value="bloom">CELLULAR BLOOM</option>
      <option value="torque">TORQUE PRESSURE</option>
      <option value="house">HOUSE REACTIVE</option>
    </select>
  </label>
  <div class="control">DENSITY <input id="density" type="range" min="0.7" max="1.6" step="0.05" value="1"></div>
  <div class="control">MOTION <input id="motion" type="range" min="0.4" max="2.2" step="0.05" value="1"></div>
  <div class="control">CONTRAST <input id="contrast" type="range" min="0.8" max="1.6" step="0.05" value="1.1"></div>
</header>
<div id="stage">
  <canvas id="view"></canvas>
  <div id="hud"></div>
  <div id="status">DEMO MODE · PRESET LIQUID CELLS</div>
</div>
<audio id="audio" crossorigin="anonymous"></audio>
<script>
(()=>{
'use strict';
const $=s=>document.querySelector(s);
const view=$('#view'), vctx=view.getContext('2d',{alpha:false});
const low=document.createElement('canvas'), ctx=low.getContext('2d',{alpha:false,willReadFrequently:false});
const fileInput=$('#file'), micBtn=$('#mic'), demoBtn=$('#demo'), resetBtn=$('#reset'), fullBtn=$('#fullscreen');
const presetSel=$('#preset'), densitySlider=$('#density'), motionSlider=$('#motion'), contrastSlider=$('#contrast');
const hud=$('#hud'), status=$('#status'), audioEl=$('#audio');
const bandsDef=[['SUB',20,90],['BASS',90,250],['LOW MID',250,900],['HIGH MID',900,4000],['AIR',4000,16000]];
const presetDefs={
liquid:{name:'LIQUID CELLS',desc:'OOZE / CELL PRESSURE',palette:['#000000','#bfe044','#f0642a','#7a5cf6'],levels:[0.36,0.58,0.79],grid:84,blobs:7,bias:0.0,swirl:0.25,ridge:0.10,seedDots:0.0,center:0.18,noise:0.40,flow:0.22},
ribbon:{name:'RIBBON FLOW',desc:'VERTICAL RIBBON DRIFT',palette:['#000000','#4b72ef','#efc24d','#ef6170'],levels:[0.34,0.56,0.76],grid:86,blobs:6,bias:-0.06,swirl:0.18,ridge:0.42,seedDots:0.0,center:0.0,noise:0.18,flow:1.0},
bloom:{name:'CELLULAR BLOOM',desc:'BLOOM / PINCH / PETAL',palette:['#000000','#e9d84f','#66c7e8','#d856bc'],levels:[0.33,0.55,0.76],grid:80,blobs:8,bias:0.02,swirl:0.54,ridge:0.08,seedDots:0.0,center:0.72,noise:0.32,flow:0.15},
torque:{name:'TORQUE PRESSURE',desc:'PRESSURE CORE / DENSE TORQUE',palette:['#000000','#ff4ad4','#ff6923','#fff14c'],levels:[0.35,0.57,0.81],grid:82,blobs:9,bias:0.05,swirl:0.72,ridge:0.20,seedDots:0.0,center:0.95,noise:0.28,flow:0.10},
house:{name:'HOUSE REACTIVE',desc:'RING HALO / CLUB ENERGY',palette:['#000000','#ff43c7','#62d5f0','#f3e14e'],levels:[0.30,0.49,0.66],grid:84,blobs:10,bias:0.02,swirl:0.44,ridge:0.12,seedDots:0.14,center:0.34,noise:0.50,flow:0.35}
};
let presetKey='liquid', preset=presetDefs[presetKey];
let W=320,H=180,GW=84,GH=48,DPR=1,imgData=null,pix=null;
let t0=performance.now(), frame=0, seed=Math.random()*9999;
let blobs=[], demoMode=true, statusBase='DEMO MODE';
let audioCtx=null, analyser=null, freqData=null, timeData=null, sourceNode=null, micStream=null, previousEnergy=0;
let bands=[0,0,0,0,0], smooth=[0,0,0,0,0], transient=0;
function setStatus(base){statusBase=base;status.textContent=base+' · PRESET '+preset.name;}
function rand(n=1){seed+=0.731;const x=Math.sin(seed*12.9898)*43758.5453;return (x-Math.floor(x))*n;}
function fract(x){return x-Math.floor(x);}
function noise2(x,y,t){return Math.sin(x*0.11+y*0.09+t*0.65)+Math.sin(x*0.037-y*0.057-t*0.49)+Math.sin((x+y)*0.023+t*0.31);}
function resize(){
const r=view.getBoundingClientRect();
DPR=Math.min(devicePixelRatio||1,2);
view.width=Math.max(1,Math.floor(r.width*DPR));
view.height=Math.max(1,Math.floor(r.height*DPR));
W=Math.max(240,Math.round((preset.grid||84)*(r.width/Math.max(1,r.height))));
H=preset.grid||84;
if(r.width>=r.height){H=preset.grid||84;W=Math.max(72,Math.round(H*(r.width/Math.max(1,r.height))));}
else{W=preset.grid||84;H=Math.max(72,Math.round(W*(r.height/Math.max(1,r.width))));}
GW=W;GH=H;low.width=GW;low.height=GH;imgData=ctx.createImageData(GW,GH);pix=imgData.data;vctx.imageSmoothingEnabled=false;reseed();}
function makeBlob(i){const a=(i/Math.max(1,preset.blobs))*Math.PI*2+rand(Math.PI*0.5),r=0.16+rand(0.28);return{x:0.5+Math.cos(a)*r,y:0.5+Math.sin(a)*r,vx:(rand()-0.5)*0.002,vy:(rand()-0.5)*0.002,s:0.09+rand(0.18),p:rand(Math.PI*2),q:rand(Math.PI*2),ring:0.4+rand(1.25)};}
function reseed(){seed=Math.random()*9999;blobs=Array.from({length:preset.blobs},(_,i)=>makeBlob(i));}
function setPreset(key){presetKey=key;preset=presetDefs[key];resize();setStatus(statusBase);}
function setupAudio(){if(audioCtx)return;audioCtx=new(window.AudioContext||window.webkitAudioContext)();analyser=audioCtx.createAnalyser();analyser.fftSize=2048;analyser.smoothingTimeConstant=0.68;freqData=new Uint8Array(analyser.frequencyBinCount);timeData=new Uint8Array(analyser.fftSize);analyser.connect(audioCtx.destination);}
function stopInput(){try{sourceNode&&sourceNode.disconnect();}catch(e){}sourceNode=null;if(micStream){micStream.getTracks().forEach(t=>t.stop());micStream=null;}audioEl.pause();}
async function useFile(file){setupAudio();await audioCtx.resume();stopInput();audioEl.src=URL.createObjectURL(file);audioEl.loop=true;sourceNode=audioCtx.createMediaElementSource(audioEl);sourceNode.connect(analyser);await audioEl.play();demoMode=false;demoBtn.classList.remove('active');micBtn.classList.remove('active');setStatus('FILE · '+file.name.toUpperCase());}
async function useMic(){setupAudio();await audioCtx.resume();stopInput();micStream=await navigator.mediaDevices.getUserMedia({audio:true});sourceNode=audioCtx.createMediaStreamSource(micStream);sourceNode.connect(analyser);demoMode=false;micBtn.classList.add('active');demoBtn.classList.remove('active');setStatus('LIVE MICROPHONE INPUT');}
function hzToBin(hz){if(!audioCtx||!analyser)return 0;return Math.max(0,Math.min(freqData.length-1,Math.floor(hz/(audioCtx.sampleRate/2)*freqData.length)));}
function sampleAudio(t){
const motionMult=Number(motionSlider.value),densityMult=Number(densitySlider.value);
if(demoMode){const beat=(t*2.0)%1,kick=Math.exp(-beat*14.5),off=(t*4.0+0.5)%1,hat=Math.exp(-off*26),groove=(Math.sin(t*2.7)+1)*0.5;bands=[Math.min(1,0.12+kick*0.98),Math.min(1,0.22+Math.max(0,Math.sin(t*2.2))*0.40+kick*0.32),0.24+(Math.sin(t*1.1+1.2)+1)*0.16,0.18+(Math.sin(t*5.4)*Math.sin(t*0.63)+1)*0.18,Math.min(1,0.06+hat*0.9+groove*0.06)];transient=Math.max(transient*0.84,kick*0.95,hat*0.3);}else if(analyser){analyser.getByteFrequencyData(freqData);analyser.getByteTimeDomainData(timeData);bands=bandsDef.map(def=>{const a=hzToBin(def[1]),b=Math.max(a+1,hzToBin(def[2]));let sum=0,w=0;for(let i=a;i<=b;i++){const ww=1+(i-a)/Math.max(1,b-a)*0.25;sum+=(freqData[i]/255)*ww;w+=ww;}return Math.min(1,(sum/w)*motionMult*1.1);});let rms=0;for(let i=0;i<timeData.length;i++){const v=(timeData[i]-128)/128;rms+=v*v;}rms=Math.sqrt(rms/timeData.length);const delta=Math.max(0,rms-previousEnergy*0.86);previousEnergy=rms;transient=Math.max(transient*0.82,Math.min(1,delta*7));}
for(let i=0;i<5;i++)smooth[i]+=(bands[i]-smooth[i])*(bands[i]>smooth[i]?0.24:0.08);smooth[2]*=densityMult;smooth[2]=Math.min(1.3,smooth[2]);}
function updateBlobs(t,dt){const sub=smooth[0],bass=smooth[1],lowm=smooth[2],high=smooth[3],air=smooth[4],cx=0.5,cy=0.5;blobs.forEach(b=>{const a=b.p+t*(0.2+b.ring*0.08)*(0.4+bass*1.2),drift=0.0025*Number(motionSlider.value),flowY=(preset.flow||0)*0.0015*(0.3+bass*1.8);b.vx+=Math.cos(a)*(0.00045+bass*0.0012)+Math.sin(t*0.7+b.q)*drift*0.55;b.vy+=Math.sin(a)*(0.00045+bass*0.0012)+Math.cos(t*0.43+b.p)*drift*0.55+flowY;if(preset.center){const dx=cx-b.x,dy=cy-b.y,pull=preset.center*(0.0002+sub*0.0026+transient*0.0022);b.vx+=dx*pull;b.vy+=dy*pull;if(presetKey==='torque'||presetKey==='bloom'){b.vx+=-dy*(preset.swirl*0.0007*(0.4+bass*1.6));b.vy+=dx*(preset.swirl*0.0007*(0.4+bass*1.6));}}if(presetKey==='ribbon'){b.vx+=Math.sin((b.y+t*0.2)*8+b.q)*0.0008*(0.3+high*1.2);b.vy+=0.0006+lowm*0.0008;}if(presetKey==='house'){b.vx+=Math.cos(t*5+b.q)*0.0007*air;b.vy+=Math.sin(t*5+b.p)*0.0007*air;}b.s+=((0.08+lowm*0.13+Math.sin(t+b.q)*0.015)-b.s)*(0.02+lowm*0.04);b.vx*=0.975-air*0.01;b.vy*=0.975-air*0.01;b.x+=b.vx*dt*60;b.y+=b.vy*dt*60;if(b.x<0.05||b.x>0.95)b.vx*=-1;if(b.y<0.05||b.y>0.95)b.vy*=-1;b.x=Math.max(0.05,Math.min(0.95,b.x));b.y=Math.max(0.05,Math.min(0.95,b.y));});}
function fieldValue(nx,ny,t){const sub=smooth[0],bass=smooth[1],lowm=smooth[2],high=smooth[3],air=smooth[4];let x=nx,y=ny;const cx=0.5,cy=0.5,dx=x-cx,dy=y-cy,dist=Math.sqrt(dx*dx+dy*dy)+1e-6,swirl=(preset.swirl||0)*(0.015+bass*0.06);x+=-dy*swirl*Math.cos(t*0.6+dist*8);y+=dx*swirl*Math.sin(t*0.6+dist*8);const n=noise2(x*GW*0.7,y*GH*0.7,t);x+=(preset.noise||0)*0.008*n*(0.3+high*0.8);y+=(preset.noise||0)*0.008*Math.sin(n+t)*(0.3+high*0.8);let val=preset.bias||0;for(let i=0;i<blobs.length;i++){const b=blobs[i];let bx=x-b.x,by=y-b.y;if(presetKey==='ribbon')bx*=1.8;if(presetKey==='liquid'||presetKey==='house')by*=1.2;const d2=bx*bx+by*by+0.00008;val+=(b.s*(0.22+lowm*0.65))/d2*0.028;}if((preset.ridge||0)>0){const ridge=Math.sin((y*(5+preset.flow*7)+t*(0.4+bass*2.0))*Math.PI);val+=Math.abs(ridge)*preset.ridge*(0.12+0.22*bass);}if((preset.center||0)>0.01){const core=Math.exp(-(dist*dist)/(0.012+0.05*(0.4+sub)));if(presetKey==='bloom'||presetKey==='torque'){const petals=Math.cos(Math.atan2(dy,dx)*(presetKey==='bloom'?6:10)+t*(0.4+bass*1.2));val+=core*(preset.center*0.28+Math.max(0,petals)*preset.center*0.26*(0.4+sub));}else val+=core*preset.center*0.22*(0.6+sub);}if(presetKey==='house'){let ring=0;for(let i=0;i<3;i++){const a=i*2.094+t*(0.35+bass*0.5),rx=0.5+Math.cos(a)*0.18,ry=0.5+Math.sin(a)*0.14,dd=Math.hypot(x-rx,y-ry);ring+=Math.exp(-((dd-(0.06+sub*0.08))**2)/(0.00085+air*0.0012));}val+=ring*0.18;}val+=(Math.sin((x+y+t*0.08)*10)+Math.sin((x-y-t*0.05)*8))*0.01*air;return val;}
function hexToRgb(hex){hex=hex.replace('#','');return[parseInt(hex.slice(0,2),16),parseInt(hex.slice(2,4),16),parseInt(hex.slice(4,6),16)];}
function renderField(t){const contrast=Number(contrastSlider.value),lv=preset.levels.map(v=>v/contrast),colors=preset.palette.map(hexToRgb),seedDots=(preset.seedDots||0)*(0.15+smooth[4]*0.9);for(let y=0;y<GH;y++){const ny=y/Math.max(1,GH-1);for(let x=0;x<GW;x++){const nx=x/Math.max(1,GW-1);let v=fieldValue(nx,ny,t),idx=0;if(v>lv[0])idx=1;if(v>lv[1])idx=2;if(v>lv[2])idx=3;if(seedDots>0&&idx>0){const h=fract(Math.sin((x*12.9898+y*78.233+frame*0.17))*43758.5453);if(h<seedDots*0.17&&((x+y)&1)===0)idx=Math.max(1,idx-1);}const p=(y*GW+x)*4,c=colors[idx];pix[p]=c[0];pix[p+1]=c[1];pix[p+2]=c[2];pix[p+3]=255;}}ctx.putImageData(imgData,0,0);vctx.fillStyle='#050505';vctx.fillRect(0,0,view.width,view.height);vctx.drawImage(low,0,0,view.width,view.height);}
function updateHud(){hud.innerHTML=bandsDef.map((b,i)=>`<span>${b[0]}</span><span class="meter"><span class="fill" style="display:block;width:${Math.round(Math.min(100,smooth[i]*100))}%"></span></span>`).join('')+`<span>MODE</span><span>${preset.desc}</span>`;}
function animate(now){const dt=Math.min(0.033,(now-t0)/1000||0.016);t0=now;const t=now/1000;frame++;sampleAudio(t);updateBlobs(t,dt);renderField(t);if(frame%3===0)updateHud();requestAnimationFrame(animate);}
fileInput.addEventListener('change',e=>{const f=e.target.files?.[0];if(f)useFile(f).catch(err=>setStatus('AUDIO ERROR · '+err.message));});
micBtn.addEventListener('click',()=>useMic().catch(err=>setStatus('MIC ERROR · '+err.message)));
demoBtn.addEventListener('click',()=>{stopInput();demoMode=true;demoBtn.classList.add('active');micBtn.classList.remove('active');setStatus('DEMO MODE');});
resetBtn.addEventListener('click',()=>reseed());
fullBtn.addEventListener('click',()=>document.documentElement.requestFullscreen?.());
presetSel.addEventListener('change',()=>setPreset(presetSel.value));
window.addEventListener('resize',resize,{passive:true});
resize();setStatus('DEMO MODE');requestAnimationFrame(animate);
})();
</script>
</body>
</html>
