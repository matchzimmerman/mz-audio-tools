 class="sel">STYLE<select id="style"><option>PARTICLE</option><option>FIELD</option><option>DITHER</option><option>ORGANISM</option><option>PHANTOM</option></select></label><div class="ctl">PARTICLES <input id="count" type="range" min="200" max="1800" step="50" value="900"></div><div class="ctl">SENSITIVITY <input id="sens" type="range" min="0.5" max="3" step="0.05" value="1.6"></div><div class="ctl">TRAIL <input id="trail" type="range" min="0.02" max="0.3" step="0.01" value="0.1"></div></header><div id="stage"><canvas id="v"></canvas><div id="hud"></div><div id="status">DEMO MODE · STYLE PARTICLE</div></div><audio id="audio" crossorigin="anonymous"></audio><script>(()=>{const $=s=>document.querySelector(s),v=$("#v"),vx=v.getContext('2d',{alpha:false}),low=document.createElement('canvas'),x=low.getContext('2d',{alpha:false}),audio=$("#audio"),file=$("#file"),mic=$("#mic"),demo=$("#demo"),reset=$("#reset"),full=$("#full"),styleSel=$("#style"),count=$("#count"),sens=$("#sens"),trail=$("#trail"),hud=$("#hud"),status=$("#status");let W=320,H=180,seed=1,parts=[],frame=0,mode='PARTICLE',demoMode=true,ctx,an,fd,td,src,stream,prev=0,hit=0,b=[0,0,0,0,0],s=[0,0,0,0,0];const names=['SUB','BASS','LOW MID','HIGH MID','AIR'],palettes=[['#f2ff00','#ff3b00','#10f7c5','#9a4dff','#fff7dd'],['#fff200','#ff005d','#00d9ff','#6dff00','#ffffff'],['#ff6b00','#ffe600','#ff36e4','#00ff9d','#e8f1ff']],desc={PARTICLE:'CLASSIC PARTICLE FLOW',FIELD:'WIND THROUGH GRAIN',DITHER:'CHUNKY DITHER FIELD',ORGANISM:'LIVING CELL CLUSTERS',PHANTOM:'SYMMETRICAL GHOST GRID'};let pal=palettes[0];const rnd=n=>(seed=Math.sin((seed+=.731)*12.9898)*43758.5453,((seed-Math.floor(seed))*(n||1)));function setStatus(t){status.textContent=t+' · STYLE '+mode}function resize(){const r=v.getBoundingClientRect();v.width=r.width*Math.min(devicePixelRatio||1,2);v.height=r.height*Math.min(devicePixelRatio||1,2);H=180;W=Math.max(240,Math.round(H*(r.width/Math.max(1,r.height))));low.width=W;low.height=H;reseed(false)}function p (p.y<-4)p.y=H+4;if(p.y>H+4)p.y=-4}function dr(p,t){let e=s[p.band],sp=Math.hypot(p.vx,p.vy);x.strokeStyle=p.c;x.fillStyle=p.c;if(mode==='PARTICLE'){x.globalAlpha=.22+e*.72;if(p.band===0){let z=1.3+e*2.2;x.fillRect(p.x-z/2|0,p.y-z/2|0,Math.max(1,z|0),Math.max(1,z|0))}else{x.beginPath();x.moveTo(p.px,p.py);x.lineTo(p.x,p.y);x.stroke();if(p.band===2&&e>.5)x.fillRect(p.x|0,p.y|0,1,1)}}else if(mode==='FIELD'){let len=1.5+sp*2.5+e*2.2,a=Math.atan2(p.vy,p.vx);x.globalAlpha=.12+e*.5;x.beginPath();x.moveTo(p.x,p.y);x.lineTo(p.x+Math.cos(a)*len,p.y+Math.sin(a)*len);x.stroke()}else if(mode==='DITHER'){let qx=Math.round(p.x/2)*2,qy=Math.round(p.y/2)*2,z=2+(p.band===0);x.globalAlpha=.15+e*.7;x.fillRect(qx,qy,z,z);if(sp>.45)x.fillRect(qx-1,qy+1,1,1)}else if(mode==='ORGANISM'){let z=1+e*2.1+(p.band===2?.6:0);x.globalAlpha=.15+e*.58;x.fillRect(p.x-z*.5|0,p.y-z*.5|0,Math.max(1,z|0),Math.max(1,z|0));if(p.band===2||p.band===3){x.globalAlpha=.08+e*.22;x.fillRect(p.x+1|0,p.y|0,1,1);x.fillRect(p.x|0,p.y+1|0,1,1)}}else if(mode==='PHANTOM'){let gx=Math.round(p.x/3)*3,gy=Math.round(p.y/3)*3,mx=W-gx,my=H-gy;x.globalAlpha=.08+e*.45;x.fillRect(gx,gy,1+(p.band===0),1+(p.band===0));if((p.band+frame)%3===0)x.fillRect(mx,gy,1,1);if((p.band+frame)%4===0)x.fillRect(gx,my,1,1);if(s[4]>.22)x.fillRect(mx,my,1,1)}x.globalAlpha=1}function overlay(t){if(mode==='FIELD'){x.globalAlpha=.04+((s[0]+s[1]+s[2])/3)*.08;x.fillStyle=pal[(frame>>4)%pal.length];for(let i=0;i<18;i++){let y=i/17*H,o=Math.sin(t*1.2+i*.7)*8*s[3]+Math.cos(t*.7+i*.4)*4*s[1];for(let X=(i+frame)%7;X<W;X+=7){let yy=Math.round(y+Math.sin(X*.05+t+i)*2+o*.18);if(((X+i+frame)&1)===0)x.fillRect(X,yy,1,1)}}x.globalAlpha=1}if(mode==='PHANTOM'){let g=12,e=s[4]*.12+s[3]*.05;x.globalAlpha=.05+e;x.strokeStyle=pal[4]||'#fff';for(let X=0;X<W;X+=g){x.beginPath();x.moveTo(X,0);x.lineTo(X,H);x.stroke()}for(let Y=0;Y<H;Y+=g){x.beginPath();x.moveTo(0,Y);x.lineTo(W,Y);x.stroke()}x.globalAlpha=1}}function dither(t){let e=(s[2]+s[3])*.5,step=mode==='DITHER'?4:mod
