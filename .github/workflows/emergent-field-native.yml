name: Build MZ Emergent Field Native

on:
  push:
    branches:
      - main
    paths:
      - "native/emergent-field/**"
      - ".github/workflows/emergent-field-native.yml"
  pull_request:
    paths:
      - "native/emergent-field/**"
      - ".github/workflows/emergent-field-native.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos-universal:
    runs-on: macos-15
    timeout-minutes: 50

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Configure universal macOS build
        shell: bash
        run: |
          set -o pipefail
          mkdir -p native/emergent-field/ci-logs/macos
          cmake -S native/emergent-field -B native/emergent-field/build -G Xcode \
            -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0 \
            2>&1 | tee native/emergent-field/ci-logs/macos/configure.log

      - name: Build AU VST3 and standalone
        shell: bash
        run: |
          set -o pipefail
          cmake --build native/emergent-field/build --config Release \
            --target MZEmergentField_All --parallel 3 \
            2>&1 | tee native/emergent-field/ci-logs/macos/build.log

      - name: Collect macOS bundles
        shell: bash
        run: |
          set -euo pipefail
          rm -rf native/emergent-field/dist-macos
          mkdir -p native/emergent-field/dist-macos

          bundle_count=0
          while IFS= read -r -d '' bundle; do
            cp -R "$bundle" native/emergent-field/dist-macos/
            bundle_count=$((bundle_count + 1))
          done < <(
            find native/emergent-field/build/MZEmergentField_artefacts/Release \
              -maxdepth 3 -type d \
              \( -name '*.vst3' -o -name '*.component' -o -name '*.app' \) \
              -print0
          )

          echo "Collected ${bundle_count} macOS bundles"
          test "$bundle_count" -ge 3
          ditto -c -k --sequesterRsrc --keepParent \
            native/emergent-field/dist-macos native/emergent-field/MZ-EMERGENT-FIELD-macOS.zip

      - name: Upload macOS diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MZ-EMERGENT-FIELD-macOS-diagnostics
          path: native/emergent-field/ci-logs/macos
          if-no-files-found: error
          retention-days: 14

      - name: Upload unsigned macOS build
        uses: actions/upload-artifact@v4
        with:
          name: MZ-EMERGENT-FIELD-macOS-unsigned
          path: native/emergent-field/MZ-EMERGENT-FIELD-macOS.zip
          if-no-files-found: error
          retention-days: 14

  windows-x64:
    runs-on: windows-latest
    timeout-minutes: 50

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Configure Windows x64 build
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force native/emergent-field/ci-logs/windows | Out-Null
          cmake -S native/emergent-field -B native/emergent-field/build-windows `
            -G "Visual Studio 18 2026" -A x64 `
            2>&1 | Tee-Object native/emergent-field/ci-logs/windows/configure.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build VST3 and standalone
        shell: pwsh
        run: |
          cmake --build native/emergent-field/build-windows --config Release `
            --target MZEmergentField_All --parallel 3 `
            2>&1 | Tee-Object native/emergent-field/ci-logs/windows/build.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Collect Windows bundles
        shell: pwsh
        run: |
          $source = "native/emergent-field/build-windows/MZEmergentField_artefacts/Release"
          $dist = "native/emergent-field/dist-windows"
          Remove-Item $dist -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force $dist | Out-Null

          Get-ChildItem $source -Recurse -Directory -Filter *.vst3 | ForEach-Object {
            Copy-Item $_.FullName $dist -Recurse -Force
          }
          Get-ChildItem $source -Recurse -File -Filter *.exe | ForEach-Object {
            Copy-Item $_.FullName $dist -Force
          }

          $count = (Get-ChildItem $dist).Count
          Write-Host "Collected $count Windows bundles"
          if ($count -lt 2) { throw "Expected VST3 and standalone outputs" }

          Compress-Archive -Path "$dist/*" `
            -DestinationPath native/emergent-field/MZ-EMERGENT-FIELD-Windows.zip -Force

      - name: Upload Windows diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MZ-EMERGENT-FIELD-Windows-diagnostics
          path: native/emergent-field/ci-logs/windows
          if-no-files-found: error
          retention-days: 14

      - name: Upload unsigned Windows build
        uses: actions/upload-artifact@v4
        with:
          name: MZ-EMERGENT-FIELD-Windows-unsigned
          path: native/emergent-field/MZ-EMERGENT-FIELD-Windows.zip
          if-no-files-found: error
          retention-days: 14
