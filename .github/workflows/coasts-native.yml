name: Build COASTS Native

on:
  push:
    branches:
      - main
    paths:
      - "native/coasts/**"
      - ".github/workflows/coasts-native.yml"
  pull_request:
    paths:
      - "native/coasts/**"
      - ".github/workflows/coasts-native.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos-universal:
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Configure universal macOS build
        shell: bash
        run: |
          set -o pipefail
          mkdir -p native/coasts/ci-logs
          cmake -S native/coasts -B native/coasts/build -G Xcode \
            -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0 \
            2>&1 | tee native/coasts/ci-logs/configure.log

      - name: Build VST3 AU and standalone
        shell: bash
        run: |
          set -o pipefail
          cmake --build native/coasts/build --config Release --target Coasts_All --parallel 3 \
            2>&1 | tee native/coasts/ci-logs/build.log

      - name: Inventory build output
        if: always()
        shell: bash
        run: |
          find native/coasts/build -maxdepth 6 -print \
            | sort \
            | tee native/coasts/ci-logs/build-tree.txt

      - name: Collect plug-in bundles
        shell: bash
        run: |
          set -euo pipefail
          rm -rf native/coasts/dist
          mkdir -p native/coasts/dist

          bundle_count=0
          while IFS= read -r -d '' bundle; do
            cp -R "$bundle" native/coasts/dist/
            bundle_count=$((bundle_count + 1))
          done < <(
            find native/coasts/build/Coasts_artefacts/Release \
              -maxdepth 3 -type d \
              \( -name '*.vst3' -o -name '*.component' -o -name '*.app' \) \
              -print0
          )

          echo "Collected ${bundle_count} native bundles"
          test "$bundle_count" -ge 3
          ditto -c -k --sequesterRsrc --keepParent \
            native/coasts/dist native/coasts/MZ-04-COASTS-macOS.zip

      - name: Upload CI diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MZ-04-COASTS-ci-diagnostics
          path: native/coasts/ci-logs
          if-no-files-found: error
          retention-days: 14

      - name: Upload unsigned development build
        uses: actions/upload-artifact@v4
        with:
          name: MZ-04-COASTS-macOS-unsigned
          path: native/coasts/MZ-04-COASTS-macOS.zip
          if-no-files-found: error
          retention-days: 14
